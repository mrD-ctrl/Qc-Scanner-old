<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Universal Line Inspector with Profiles</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 12px; }
    
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
    h1 { font-size: 1rem; }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .counter-box { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); padding: 4px 8px; border-radius: 8px; text-align: center; display: flex; align-items: center; gap: 8px; }
    .counter-val { font-size: 1.2rem; font-weight: bold; color: var(--danger); }
    
    .profile-select { background: #0f172a; color: var(--text); border: 1px solid #475569; padding: 6px; border-radius: 6px; font-size: 0.8rem; }

    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media(min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid #334155; }
    .card h2 { font-size: 0.9rem; margin-bottom: 8px; color: var(--accent); }

    .video-container { position: relative; width: 100%; height: 300px; background: #000; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: contain; }
    
    /* Smart Wide ROI Overlay (Covers 80% width & 80% height of belt frame) */
    .roi-overlay {
      position: absolute;
      top: 10%; left: 10%; width: 80%; height: 80%;
      border: 2px dashed var(--warning);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      border-radius: 6px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }
    .roi-label { background: var(--warning); color: #000; font-size: 0.65rem; font-weight: bold; padding: 2px 6px; border-radius: 0 0 4px 4px; }

    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    button, label.btn-upload { background: var(--accent); color: white; border: none; padding: 8px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: bold; cursor: pointer; display: inline-block; text-align: center; }
    input[type="file"] { display: none; }
    
    .status-badge { display: inline-block; padding: 8px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-top: 8px; width: 100%; text-align: center; }
    .status-pass { background: var(--success); }
    .status-fail { background: var(--danger); }
    .status-empty { background: #334155; color: var(--text-muted); }
    .status-standby { background: var(--warning); color: #000; }

    .slider-group { margin-top: 8px; font-size: 0.75rem; display: flex; align-items: center; gap: 8px; }
    .slider-group input { flex-grow: 1; }

    .sample-strip { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; padding-bottom: 4px; min-height: 48px; align-items: center; }
    .sample-thumb-good { width: 42px; height: 42px; border-radius: 4px; border: 2px solid var(--success); object-fit: cover; }
    .sample-thumb-bad { width: 42px; height: 42px; border-radius: 4px; border: 2px solid var(--danger); object-fit: cover; }

    .log-list { max-height: 160px; overflow-y: auto; margin-top: 8px; }
    .log-item { display: flex; gap: 10px; background: #090d16; padding: 6px; border-radius: 6px; margin-bottom: 4px; border-left: 4px solid var(--danger); align-items: center; }
    .log-item img { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; }
    .log-info { font-size: 0.75rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Line Inspector Engine</h1>
    </div>
    
    <div class="header-actions">
      <!-- Profile Loader Dropdown -->
      <select id="profileSelect" class="profile-select" onchange="loadSelectedProfile()">
        <option value="">-- Load Saved Profile --</option>
      </select>

      <!-- Alarm Mute Button -->
      <button id="muteBtn" onclick="toggleMute()" style="background: #334155;">🔊 Alarm: ON</button>
      
      <!-- Counter & Reset Button -->
      <div class="counter-box">
        <div style="font-size: 0.65rem;">REJECTS:</div>
        <div id="defectCount" class="counter-val">0</div>
        <button onclick="resetCount()" style="background: var(--danger); padding: 2px 6px; font-size: 0.65rem; margin-left: 4px;">Reset</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Live Line View</h2>
      <div class="video-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div class="roi-overlay">
          <span class="roi-label">WIDE INSPECTION ZONE</span>
        </div>
      </div>
      
      <div class="controls">
        <button onclick="startCamera('environment')">Rear Cam</button>
        <button onclick="startCamera('user')">Front Cam</button>
        <button id="toggleScanBtn" onclick="toggleScanning()" style="background: var(--success);">Start Line Inspection</button>
      </div>

      <div class="slider-group">
        <label>Camera Zoom:</label>
        <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" oninput="applyZoom(this.value)">
        <span id="zoomVal">1.0x</span>
      </div>

      <div class="slider-group">
        <label>Sensitivity (Tolerance):</label>
        <input type="range" id="sensitivity" min="5" max="50" value="20">
        <span id="sensVal">20%</span>
      </div>

      <div class="slider-group">
        <label>Belt Trigger (Presence):</label>
        <input type="range" id="presenceSens" min="5" max="50" value="20">
        <span id="presenceVal">20%</span>
      </div>

      <div id="liveStatus" class="status-badge status-standby">STATUS: STANDBY</div>
    </div>

    <div class="card">
      <h2>Profile Calibration & Setup</h2>

      <div style="margin-bottom: 8px; background: #0f172a; padding: 8px; border-radius: 6px;">
        <strong style="font-size: 0.75rem; color: var(--accent);">Profile Management</strong>
        <div class="controls" style="margin-top: 4px;">
          <button onclick="saveCurrentProfile()" style="background: #2563eb;">💾 Save Current Profile</button>
          <button onclick="deleteSelectedProfile()" style="background: #475569;">🗑️ Delete Profile</button>
        </div>
      </div>
      
      <div style="margin-bottom: 6px;">
        <strong style="font-size: 0.75rem; color: var(--text-muted);">1. Belt Calibration</strong>
        <div class="controls" style="margin-top: 4px;">
          <button onclick="captureBeltFromCamera()" style="background: #334155;">Calibrate Empty Belt Baseline</button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #334155; margin: 6px 0;">

      <div style="margin-bottom: 6px;">
        <strong style="font-size: 0.75rem; color: var(--success);">2. Good Target Samples (<span id="goodCount">0</span>)</strong>
        <div id="goodStrip" class="sample-strip"></div>
        <div class="controls" style="margin-top: 4px;">
          <button onclick="captureGoodSample()" style="background: var(--success);">+ Snap Good</button>
          <label class="btn-upload" style="background: var(--success);">
            📁 Upload Good
            <input type="file" accept="image/*" multiple onchange="uploadGoodImage(event)">
          </label>
          <button onclick="clearGoodSamples()" style="background: #334155;">Clear</button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #334155; margin: 6px 0;">

      <div>
        <strong style="font-size: 0.75rem; color: var(--danger);">3. Defect/Reject Bank (<span id="badCount">0</span>)</strong>
        <div id="badStrip" class="sample-strip"></div>
        <div class="controls" style="margin-top: 4px;">
          <button onclick="captureBadSample()" style="background: var(--danger);">+ Snap Reject</button>
          <label class="btn-upload" style="background: var(--danger);">
            📁 Upload Reject
            <input type="file" accept="image/*" multiple onchange="uploadBadImage(event)">
          </label>
          <button onclick="clearBadSamples()" style="background: #334155;">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top: 12px;">
    <h2>Defect Audit Log</h2>
    <div id="logList" class="log-list"></div>
  </div>

  <canvas id="procCanvas" width="128" height="128" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const procCanvas = document.getElementById('procCanvas');
    const procCtx = procCanvas.getContext('2d');
    
    const sensitivityInput = document.getElementById('sensitivity');
    const sensValDisplay = document.getElementById('sensVal');
    const presenceInput = document.getElementById('presenceSens');
    const presenceValDisplay = document.getElementById('presenceVal');
    const zoomRange = document.getElementById('zoomRange');
    const zoomValDisplay = document.getElementById('zoomVal');
    
    const liveStatus = document.getElementById('liveStatus');
    const logList = document.getElementById('logList');
    const muteBtn = document.getElementById('muteBtn');
    const profileSelect = document.getElementById('profileSelect');

    let isScanning = false;
    let defectCount = 0;
    
    let goodHistograms = [];
    let goodThumbnails = [];
    let badHistograms = [];
    let badThumbnails = [];
    let beltColor = { r: 0, g: 100, b: 200 }; // Default blue belt baseline
    
    let hasLoggedCurrentDefect = false;
    let isMuted = false;
    let animationFrameId = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function triggerAlarm() {
      if (isMuted) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function toggleMute() {
      isMuted = !isMuted;
      muteBtn.innerText = isMuted ? "🔇 Alarm: OFF" : "🔊 Alarm: ON";
      muteBtn.style.background = isMuted ? "var(--danger)" : "#334155";
    }

    function resetCount() {
      defectCount = 0;
      document.getElementById('defectCount').innerText = '0';
      logList.innerHTML = '';
    }

    sensitivityInput.oninput = () => sensValDisplay.innerText = `${sensitivityInput.value}%`;
    presenceInput.oninput = () => presenceValDisplay.innerText = `${presenceInput.value}%`;

    async function startCamera(facingMode = 'environment') {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    function applyZoom(val) {
      zoomValDisplay.innerText = `${parseFloat(val).toFixed(1)}x`;
      video.style.transform = `scale(${val})`;
      video.style.transformOrigin = "center center";
    }

    // Capture Wide ROI: 10% margin, 80% width, 80% height (Covers main belt)
    function getROICanvas(source) {
      const sw = source.videoWidth || source.width;
      const sh = source.videoHeight || source.height;
      
      const sx = sw * 0.10;
      const sy = sh * 0.10;
      const sWidth = sw * 0.80;
      const sHeight = sh * 0.80;

      procCtx.drawImage(source, sx, sy, sWidth, sHeight, 0, 0, 128, 128);
      return procCtx.getImageData(0, 0, 128, 128);
    }

    function processFrame(imageData) {
      const hist = new Float32Array(16).fill(0);
      const data = imageData.data;
      let nonBeltPixels = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i+1], b = data[i+2];

        // Euclidean distance from calibrated belt baseline
        const dist = Math.sqrt((r-beltColor.r)**2 + (g-beltColor.g)**2 + (b-beltColor.b)**2);
        
        if (dist > 45) { 
          nonBeltPixels++;
          const brightness = (r + g + b) / 3;
          const bin = Math.floor((brightness / 256) * 16);
          hist[bin]++;
        }
      }

      const total = nonBeltPixels || 1;
      for (let i = 0; i < 16; i++) hist[i] /= total;

      return { hist, coverage: nonBeltPixels / (data.length / 4) };
    }

    function compareHistograms(h1, h2) {
      let diff = 0;
      for (let i = 0; i < 16; i++) diff += Math.abs(h1[i] - h2[i]);
      return (diff / 2) * 100;
    }

    function captureBeltFromCamera() {
      const data = getROICanvas(video).data;
      let r = 0, g = 0, b = 0, count = data.length / 4;
      for (let i = 0; i < data.length; i += 4) {
        r += data[i]; g += data[i+1]; b += data[i+2];
      }
      beltColor = { r: r/count, g: g/count, b: b/count };
      alert("Belt baseline calibrated successfully!");
    }

    function captureGoodSample() {
      const roiData = getROICanvas(video);
      goodHistograms.push(processFrame(roiData).hist);
      goodThumbnails.push(procCanvas.toDataURL('image/jpeg', 0.8));
      renderStrips();
    }

    function uploadGoodImage(e) {
      Array.from(e.target.files).forEach(file => {
        const img = new Image();
        img.onload = () => {
          goodHistograms.push(processFrame(getROICanvas(img)).hist);
          goodThumbnails.push(procCanvas.toDataURL('image/jpeg', 0.8));
          renderStrips();
        };
        img.src = URL.createObjectURL(file);
      });
    }

    function captureBadSample() {
      const roiData = getROICanvas(video);
      badHistograms.push(processFrame(roiData).hist);
      badThumbnails.push(procCanvas.toDataURL('image/jpeg', 0.8));
      renderStrips();
    }

    function uploadBadImage(e) {
      Array.from(e.target.files).forEach(file => {
        const img = new Image();
        img.onload = () => {
          badHistograms.push(processFrame(getROICanvas(img)).hist);
          badThumbnails.push(procCanvas.toDataURL('image/jpeg', 0.8));
          renderStrips();
        };
        img.src = URL.createObjectURL(file);
      });
    }

    function clearGoodSamples() { goodHistograms = []; goodThumbnails = []; renderStrips(); }
    function clearBadSamples() { badHistograms = []; badThumbnails = []; renderStrips(); }

    function renderStrips() {
      const gContainer = document.getElementById('goodStrip');
      gContainer.innerHTML = '';
      goodThumbnails.forEach(url => {
        const img = document.createElement('img');
        img.src = url; img.className = 'sample-thumb-good';
        gContainer.appendChild(img);
      });
      document.getElementById('goodCount').innerText = goodThumbnails.length;

      const bContainer = document.getElementById('badStrip');
      bContainer.innerHTML = '';
      badThumbnails.forEach(url => {
        const img = document.createElement('img');
        img.src = url; img.className = 'sample-thumb-bad';
        bContainer.appendChild(img);
      });
      document.getElementById('badCount').innerText = badThumbnails.length;
    }

    /* === PROFILE MANAGEMENT (LOCAL STORAGE) === */

    function saveCurrentProfile() {
      if (goodHistograms.length === 0) {
        alert("Please add at least ONE good target sample before saving profile.");
        return;
      }
      const profileName = prompt("Enter a name for this product profile (e.g. Graze Oats 200g):");
      if (!profileName) return;

      const profileData = {
        name: profileName,
        beltColor: beltColor,
        sensitivity: sensitivityInput.value,
        presenceSens: presenceInput.value,
        goodHistograms: goodHistograms.map(h => Array.from(h)),
        goodThumbnails: goodThumbnails,
        badHistograms: badHistograms.map(h => Array.from(h)),
        badThumbnails: badThumbnails
      };

      let savedProfiles = JSON.parse(localStorage.getItem('line_inspector_profiles') || '{}');
      savedProfiles[profileName] = profileData;
      localStorage.setItem('line_inspector_profiles', JSON.stringify(savedProfiles));

      populateProfileDropdown();
      profileSelect.value = profileName;
      alert(`Profile "${profileName}" saved successfully!`);
    }

    function populateProfileDropdown() {
      let savedProfiles = JSON.parse(localStorage.getItem('line_inspector_profiles') || '{}');
      profileSelect.innerHTML = '<option value="">-- Load Saved Profile --</option>';
      for (let name in savedProfiles) {
        const opt = document.createElement('option');
        opt.value = name;
        opt.innerText = name;
        profileSelect.appendChild(opt);
      }
    }

    function loadSelectedProfile() {
      const name = profileSelect.value;
      if (!name) return;

      let savedProfiles = JSON.parse(localStorage.getItem('line_inspector_profiles') || '{}');
      const p = savedProfiles[name];
      if (!p) return;

      beltColor = p.beltColor;
      sensitivityInput.value = p.sensitivity;
      sensValDisplay.innerText = `${p.sensitivity}%`;
      presenceInput.value = p.presenceSens;
      presenceValDisplay.innerText = `${p.presenceSens}%`;

      goodHistograms = p.goodHistograms.map(arr => new Float32Array(arr));
      goodThumbnails = p.goodThumbnails || [];
      badHistograms = p.badHistograms.map(arr => new Float32Array(arr));
      badThumbnails = p.badThumbnails || [];

      renderStrips();
      alert(`Loaded profile: ${name}`);
    }

    function deleteSelectedProfile() {
      const name = profileSelect.value;
      if (!name) { alert("Select a profile to delete."); return; }
      if (confirm(`Delete profile "${name}"?`)) {
        let savedProfiles = JSON.parse(localStorage.getItem('line_inspector_profiles') || '{}');
        delete savedProfiles[name];
        localStorage.setItem('line_inspector_profiles', JSON.stringify(savedProfiles));
        populateProfileDropdown();
        alert("Profile deleted.");
      }
    }

    /* === INSPECTION SCAN LOOP === */

    function toggleScanning() {
      if (goodHistograms.length === 0) {
        alert("Please load a Profile or add Good Samples first!");
        return;
      }
      isScanning = !isScanning;
      const btn = document.getElementById('toggleScanBtn');
      if (isScanning) {
        btn.innerText = "Stop Inspection";
        btn.style.background = "var(--danger)";
        scanLoop();
      } else {
        btn.innerText = "Start Line Inspection";
        btn.style.background = "var(--success)";
        cancelAnimationFrame(animationFrameId);
        liveStatus.className = "status-badge status-standby";
        liveStatus.innerText = "STATUS: STANDBY";
      }
    }

    function scanLoop() {
      if (!isScanning) return;
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        const roiData = getROICanvas(video);
        const { hist: currentHist, coverage } = processFrame(roiData);
        
        const triggerThreshold = parseFloat(presenceInput.value) / 100;

        if (coverage < triggerThreshold) {
          liveStatus.className = "status-badge status-empty";
          liveStatus.innerText = "BELT CLEAR";
          hasLoggedCurrentDefect = false;
        } else {
          let minGoodDiff = Math.min(...goodHistograms.map(h => compareHistograms(h, currentHist)));
          let minBadDiff = badHistograms.length > 0 ? Math.min(...badHistograms.map(h => compareHistograms(h, currentHist))) : 999;

          const defectLimit = parseFloat(sensitivityInput.value);
          const isRejectMatch = minBadDiff < minGoodDiff && minBadDiff < defectLimit;
          const isDeviation = minGoodDiff > defectLimit;

          if (isDeviation || isRejectMatch) {
            liveStatus.className = "status-badge status-fail";
            liveStatus.innerText = `DEFECT DETECTED (${minGoodDiff.toFixed(1)}% Shift)`;

            if (!hasLoggedCurrentDefect) {
              triggerAlarm();
              logDefect(minGoodDiff);
              hasLoggedCurrentDefect = true;
            }
          } else {
            liveStatus.className = "status-badge status-pass";
            liveStatus.innerText = `PASS (${minGoodDiff.toFixed(1)}% Match)`;
          }
        }
      }

      animationFrameId = requestAnimationFrame(scanLoop);
    }

    function logDefect(score) {
      defectCount++;
      document.getElementById('defectCount').innerText = defectCount;
      const snapshotUrl = procCanvas.toDataURL('image/jpeg', 0.8);

      const logItem = document.createElement('div');
      logItem.className = 'log-item';
      logItem.innerHTML = `
        <img src="${snapshotUrl}"/>
        <div class="log-info">
          <strong>Defect #${defectCount}</strong> - ${new Date().toLocaleTimeString()}<br/>
          <span style="color:var(--danger)">Shift: ${score.toFixed(1)}%</span>
        </div>
      `;
      logList.insertBefore(logItem, logList.firstChild);
    }

    window.onload = () => {
      startCamera('environment');
      populateProfileDropdown();
    };
  </script>
</body>
</html>
