<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>High-Speed Dual-Bank Line Inspector</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); padding: 12px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #334155; }
    h1 { font-size: 1.1rem; }

    .header-actions { display: flex; align-items: center; gap: 12px; }

    .counter-box { background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger); padding: 6px 12px; border-radius: 8px; text-align: center; }
    .counter-val { font-size: 1.4rem; font-weight: bold; color: var(--danger); }
    
    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media(min-width: 768px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card { background: var(--card-bg); border-radius: 12px; padding: 12px; border: 1px solid #334155; }
    .card h2 { font-size: 0.95rem; margin-bottom: 8px; color: var(--accent); }

    video, canvas, img { width: 100%; height: auto; border-radius: 8px; background: #000; object-fit: contain; max-height: 200px; }
    
    .controls { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    button { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
    
    .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; margin-top: 6px; width: 100%; text-align: center; }
    .status-pass { background: var(--success); }
    .status-fail { background: var(--danger); }
    .status-empty { background: #334155; color: var(--text-muted); }
    .status-standby { background: var(--warning); color: #000; }
    .status-auto { background: #8b5cf6; color: white; }

    .slider-group { margin-top: 8px; font-size: 0.75rem; display: flex; align-items: center; gap: 8px; }
    .slider-group input { flex-grow: 1; }

    .sample-strip { display: flex; gap: 6px; margin-top: 6px; overflow-x: auto; padding-bottom: 4px; min-height: 52px; align-items: center; }
    .sample-thumb-good { width: 46px; height: 46px; border-radius: 4px; border: 2px solid var(--success); object-fit: cover; }
    .sample-thumb-bad { width: 46px; height: 46px; border-radius: 4px; border: 2px solid var(--danger); object-fit: cover; }

    .log-list { max-height: 200px; overflow-y: auto; margin-top: 8px; }
    .log-item { display: flex; gap: 12px; background: #090d16; padding: 8px; border-radius: 6px; margin-bottom: 6px; border-left: 4px solid var(--danger); align-items: center; }
    .log-item img { width: 44px; height: 44px; object-fit: cover; border-radius: 4px; }
    .log-info { font-size: 0.78rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Dual-Bank Line Inspector</h1>
      <p style="font-size: 0.7rem; color: var(--text-muted);">Auto-good sampling & defect profile matching</p>
    </div>
    
    <div class="header-actions">
      <button id="muteBtn" onclick="toggleMute()" style="background: #475569;">🔊 Alarm: MAX</button>
      <div class="counter-box">
        <div style="font-size: 0.65rem;">DEFECT COUNT</div>
        <div id="defectCount" class="counter-val">0</div>
        <button onclick="resetCount()" style="background: var(--danger); padding: 2px 6px; font-size: 0.7rem;">Reset</button>
      </div>
    </div>
  </header>

  <div class="grid">
    <!-- Camera View & Controls -->
    <div class="card">
      <h2>Live Line Camera</h2>
      <video id="webcam" autoplay playsinline muted></video>
      
      <div class="controls">
        <button onclick="startCamera('environment')">Rear Cam</button>
        <button onclick="startCamera('user')">Front Cam</button>
        <button id="toggleScanBtn" onclick="toggleScanning()" style="background: var(--success);">Start Line Inspection</button>
      </div>

      <div class="slider-group">
        <label>Defect Sensitivity:</label>
        <input type="range" id="sensitivity" min="5" max="40" value="18">
        <span id="sensVal">18%</span>
      </div>

      <div class="slider-group">
        <label>Belt Trigger:</label>
        <input type="range" id="presenceSens" min="3" max="30" value="8">
        <span id="presenceVal">8%</span>
      </div>

      <div id="liveStatus" class="status-badge status-standby">STATUS: STANDBY</div>
    </div>

    <!-- Reference Calibration Panel -->
    <div class="card">
      <h2>Calibration & Banks</h2>
      
      <!-- Good Target Bank -->
      <div style="margin-bottom: 8px;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <strong style="font-size: 0.78rem; color: var(--success);">Good Targets (<span id="goodCount">0</span>)</strong>
          <button onclick="startAutoGoodCapture()" style="background: #8b5cf6; padding: 4px 8px; font-size: 0.7rem;">⚡ Auto-Learn 5 Good</button>
        </div>
        <div id="goodStrip" class="sample-strip">
          <span style="font-size:0.7rem; color:var(--text-muted);">No good samples added</span>
        </div>
        <div class="controls" style="margin-top: 4px;">
          <button onclick="captureGoodSample()" style="background: var(--success); font-size: 0.75rem;">+ Add Good (Manual)</button>
          <button onclick="clearGoodSamples()" style="background: #475569; font-size: 0.75rem;">Clear Good</button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #334155; margin: 8px 0;">

      <!-- Reject Defect Bank -->
      <div>
        <strong style="font-size: 0.78rem; color: var(--danger);">Known Defects / Rejects (<span id="badCount">0</span>)</strong>
        <div id="badStrip" class="sample-strip">
          <span style="font-size:0.7rem; color:var(--text-muted);">No defect samples added</span>
        </div>
        <div class="controls" style="margin-top: 4px;">
          <button onclick="captureBadSample()" style="background: var(--danger); font-size: 0.75rem;">+ Add Reject/Defect Sample</button>
          <button onclick="clearBadSamples()" style="background: #475569; font-size: 0.75rem;">Clear Rejects</button>
        </div>
      </div>

      <hr style="border: 0; border-top: 1px solid #334155; margin: 8px 0;">

      <!-- Belt Calibration -->
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <button onclick="captureBeltFromCamera()" style="background: #475569; width: 100%;">Set Empty Belt Reference</button>
      </div>
    </div>
  </div>

  <div class="card" style="margin-top: 12px;">
    <h2>Defect Audit Log</h2>
    <div id="logList" class="log-list">
      <div style="font-size: 0.75rem; color: var(--text-muted);">No non-matching items recorded.</div>
    </div>
  </div>

  <canvas id="beltCanvas" width="120" height="120" style="display:none;"></canvas>
  <canvas id="procCanvas" width="120" height="120" style="display:none;"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const beltCanvas = document.getElementById('beltCanvas');
    const beltCtx = beltCanvas.getContext('2d');
    const procCanvas = document.getElementById('procCanvas');
    const procCtx = procCanvas.getContext('2d');
    
    const sensitivityInput = document.getElementById('sensitivity');
    const sensValDisplay = document.getElementById('sensVal');
    const presenceInput = document.getElementById('presenceSens');
    const presenceValDisplay = document.getElementById('presenceVal');
    
    const liveStatus = document.getElementById('liveStatus');
    const logList = document.getElementById('logList');
    const muteBtn = document.getElementById('muteBtn');
    
    const goodStrip = document.getElementById('goodStrip');
    const goodCountDisplay = document.getElementById('goodCount');
    const badStrip = document.getElementById('badStrip');
    const badCountDisplay = document.getElementById('badCount');

    let isScanning = false;
    let isAutoGoodCapturing = false;
    let autoGoodTargetCount = 5;
    
    let defectCount = 0;
    let goodSamples = [];
    let badSamples = [];
    let beltImageData = null;
    
    let isProductInZone = false;
    let previousPresenceScore = 0;
    let isMuted = false;
    let animationFrameId = null;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function triggerHighDecibelAlarm() {
      if (isMuted) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(1400, now);
      osc.frequency.exponentialRampToValueAtTime(700, now + 0.18);

      gain.gain.setValueAtTime(1.0, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start(now);
      osc.stop(now + 0.18);
    }

    function toggleMute() {
      isMuted = !isMuted;
      muteBtn.innerText = isMuted ? "🔇 Alarm: OFF" : "🔊 Alarm: MAX";
      muteBtn.style.background = isMuted ? "var(--danger)" : "#475569";
    }

    sensitivityInput.oninput = () => sensValDisplay.innerText = `${sensitivityInput.value}%`;
    presenceInput.oninput = () => presenceValDisplay.innerText = `${presenceInput.value}%`;

    async function startCamera(facingMode = 'environment') {
      if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    function captureGoodSample() {
      const c = document.createElement('canvas');
      c.width = 120; c.height = 120;
      const ctx = c.getContext('2d');
      ctx.drawImage(video, 0, 0, 120, 120);
      const imgData = ctx.getImageData(0, 0, 120, 120);

      goodSamples.push(imgData);

      if (goodSamples.length === 1) goodStrip.innerHTML = '';
      const img = document.createElement('img');
      img.src = c.toDataURL('image/jpeg');
      img.className = 'sample-thumb-good';
      goodStrip.appendChild(img);

      goodCountDisplay.innerText = goodSamples.length;
    }

    function startAutoGoodCapture() {
      if (!beltImageData) {
        alert("Set Empty Belt Reference first before using Auto-Learn!");
        return;
      }
      goodSamples = [];
      goodStrip.innerHTML = '';
      goodCountDisplay.innerText = '0';
      isAutoGoodCapturing = true;
      liveStatus.className = "status-badge status-auto";
      liveStatus.innerText = `AUTO-LEARNING GOOD PACKS (0/${autoGoodTargetCount})`;
      if (!isScanning) {
        isScanning = true;
        scanLoop();
      }
    }

    function clearGoodSamples() {
      goodSamples = [];
      goodStrip.innerHTML = '<span style="font-size:0.7rem; color:var(--text-muted);">No good samples added</span>';
      goodCountDisplay.innerText = '0';
    }

    function captureBadSample() {
      const c = document.createElement('canvas');
      c.width = 120; c.height = 120;
      const ctx = c.getContext('2d');
      ctx.drawImage(video, 0, 0, 120, 120);
      const imgData = ctx.getImageData(0, 0, 120, 120);

      badSamples.push(imgData);

      if (badSamples.length === 1) badStrip.innerHTML = '';
      const img = document.createElement('img');
      img.src = c.toDataURL('image/jpeg');
      img.className = 'sample-thumb-bad';
      badStrip.appendChild(img);

      badCountDisplay.innerText = badSamples.length;
    }

    function clearBadSamples() {
      badSamples = [];
      badStrip.innerHTML = '<span style="font-size:0.7rem; color:var(--text-muted);">No defect samples added</span>';
      badCountDisplay.innerText = '0';
    }

    function captureBeltFromCamera() {
      beltCtx.drawImage(video, 0, 0, beltCanvas.width, beltCanvas.height);
      beltImageData = beltCtx.getImageData(0, 0, beltCanvas.width, beltCanvas.height);
      alert("Empty Belt Baseline Saved.");
    }

    function toggleScanning() {
      if (goodSamples.length === 0) {
        alert("Add or Auto-Capture at least ONE Good Target Sample first!");
        return;
      }
      isAutoGoodCapturing = false;
      isScanning = !isScanning;
      const btn = document.getElementById('toggleScanBtn');
      
      if (isScanning) {
        btn.innerText = "Stop Inspection";
        btn.style.background = "var(--danger)";
        scanLoop();
      } else {
        btn.innerText = "Start Line Inspection";
        btn.style.background = "var(--success)";
        cancelAnimationFrame(animationFrameId);
        liveStatus.className = "status-badge status-standby";
        liveStatus.innerText = "STATUS: STANDBY";
      }
    }

    function scanLoop() {
      if (!isScanning) return;
      
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        procCtx.drawImage(video, 0, 0, procCanvas.width, procCanvas.height);
        const currentData = procCtx.getImageData(0, 0, procCanvas.width, procCanvas.height);
        
        let objectPresenceScore = beltImageData ? calculatePixelDiff(beltImageData.data, currentData.data) : 20;
        const objectTrigger = parseFloat(presenceInput.value);

        const frameDelta = Math.abs(objectPresenceScore - previousPresenceScore);
        previousPresenceScore = objectPresenceScore;

        if (objectPresenceScore < objectTrigger) {
          if (!isAutoGoodCapturing) {
            liveStatus.className = "status-badge status-empty";
            liveStatus.innerText = "BELT CLEAR";
          }
          isProductInZone = false;
        } 
        else {
          if (frameDelta > 12.0) {
            isProductInZone = false;
          }

          // 1. AUTO-LEARN MODE LOGIC
          if (isAutoGoodCapturing) {
            if (!isProductInZone) {
              captureGoodSample();
              isProductInZone = true;
              liveStatus.innerText = `AUTO-LEARNING GOOD PACKS (${goodSamples.length}/${autoGoodTargetCount})`;

              if (goodSamples.length >= autoGoodTargetCount) {
                isAutoGoodCapturing = false;
                liveStatus.className = "status-badge status-pass";
                liveStatus.innerText = "AUTO-LEARN COMPLETE! READY TO INSPECT";
                const btn = document.getElementById('toggleScanBtn');
                btn.innerText = "Stop Inspection";
                btn.style.background = "var(--danger)";
              }
            }
          } 
          // 2. NORMAL DUAL-BANK INSPECTION LOGIC
          else {
            // Find closest match in GOOD bank
            let minGoodDiff = 999;
            for (let i = 0; i < goodSamples.length; i++) {
              const diff = calculatePixelDiff(goodSamples[i].data, currentData.data);
              if (diff < minGoodDiff) minGoodDiff = diff;
            }

            // Find closest match in BAD/REJECT bank
            let minBadDiff = 999;
            for (let i = 0; i < badSamples.length; i++) {
              const diff = calculatePixelDiff(badSamples[i].data, currentData.data);
              if (diff < minBadDiff) minBadDiff = diff;
            }

            const defectThreshold = parseFloat(sensitivityInput.value);
            
            // Defect Flag: Deviation from good > threshold OR matches a bad sample closer than a good sample
            const isRejectMatch = (badSamples.length > 0) && (minBadDiff < minGoodDiff);
            const isGoodDeviation = minGoodDiff > defectThreshold;

            if (isGoodDeviation || isRejectMatch) {
              liveStatus.className = "status-badge status-fail";
              const reason = isRejectMatch ? "KNOWN DEFECT MATCH" : `${minGoodDiff.toFixed(1)}% Diff`;
              liveStatus.innerText = `DEFECT DETECTED (${reason})`;

              if (!isProductInZone) {
                triggerHighDecibelAlarm();
                logDefect(minGoodDiff, isRejectMatch);
                isProductInZone = true;
              }
            } else {
              liveStatus.className = "status-badge status-pass";
              liveStatus.innerText = `PASS (${minGoodDiff.toFixed(1)}% Diff)`;
              isProductInZone = true;
            }
          }
        }
      }

      animationFrameId = requestAnimationFrame(scanLoop);
    }

    function calculatePixelDiff(ref, current) {
      let totalDiff = 0;
      const length = ref.length;

      for (let i = 0; i < length; i += 16) { 
        const rDiff = Math.abs(ref[i] - current[i]);
        const gDiff = Math.abs(ref[i+1] - current[i+1]);
        const bDiff = Math.abs(ref[i+2] - current[i+2]);
        totalDiff += (rDiff + gDiff + bDiff) / 3;
      }

      const sampledPixels = length / 16;
      return (totalDiff / (sampledPixels * 255)) * 100;
    }

    function logDefect(score, isRejectMatch) {
      defectCount++;
      document.getElementById('defectCount').innerText = defectCount;

      const timeStr = new Date().toLocaleTimeString();
      const snapshotUrl = procCanvas.toDataURL('image/jpeg', 0.6);

      if (defectCount === 1) logList.innerHTML = '';

      const logItem = document.createElement('div');
      logItem.className = 'log-item';
      logItem.innerHTML = `
        <img src="${snapshotUrl}" alt="Defect Snapshot"/>
        <div class="log-info">
          <strong>Defect #${defectCount}</strong> - ${timeStr}<br/>
          <span style="color:var(--danger)">${isRejectMatch ? 'Matched Known Reject Profile' : 'Deviation: ' + score.toFixed(1) + '%'}</span>
        </div>
      `;
      logList.insertBefore(logItem, logList.firstChild);
    }

    function resetCount() {
      defectCount = 0;
      document.getElementById('defectCount').innerText = '0';
      logList.innerHTML = '<div style="font-size: 0.75rem; color: var(--text-muted);">No non-matching items recorded.</div>';
    }

    window.onload = () => startCamera('environment');
  </script>
</body>
</html>
